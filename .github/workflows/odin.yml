name: Android PS3 core for Odin
on:
  push:
    branches: [codex/odin-vulkan]
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3
jobs:
  android:
    name: libretro core android-${{ matrix.name }} (experimental)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            abi: arm64-v8a
            ffarch: aarch64
            triple: aarch64-linux-android
            ffextra: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Everything, LLVM included. It cannot be left out after all: the AArch64
      # CPU backend is compiled for every arm64 target and uses llvm:: types
      # without asking whether WITH_LLVM is on, so an arm64 build without LLVM
      # does not compile. Nothing ships a prebuilt LLVM for Android either, so
      # it gets built here - the long pole in this job by a wide margin.
      - name: Fetch the submodules the build uses
        run: |
          git config --global --add safe.directory '*'
          git submodule -q update --init --depth 1 \
            $(awk '/path/ { print $3 }' .gitmodules)

      # RPCS3 cannot be built without ffmpeg - the option only chooses between
      # the system copy and a prebuilt one - and the prebuilts it downloads are
      # named ffmpeg-windows, ffmpeg-macos and ffmpeg-linux. Android counts as
      # UNIX, so it would fetch a glibc Linux build and fail to link against
      # it. Cross-building one is the only way through.
      - name: Cross-build ffmpeg for Android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PREFIX="$PWD/ffmpeg-android"
          git clone --quiet --depth 1 -b release/7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --prefix="$PREFIX" \
            --target-os=android --arch=${{ matrix.ffarch }} --enable-cross-compile \
            --cc="$TC/${{ matrix.triple }}30-clang" \
            --cxx="$TC/${{ matrix.triple }}30-clang++" \
            --ar="$TC/llvm-ar" --ranlib="$TC/llvm-ranlib" \
            --nm="$TC/llvm-nm" --strip="$TC/llvm-strip" \
            --enable-static --disable-shared --enable-pic \
            --disable-programs --disable-doc --disable-avdevice --disable-network \
            ${{ matrix.ffextra }}
          make -j"$(nproc)"
          make install
          echo "FFMPEG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          ls "$PREFIX/lib/pkgconfig"

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/ffmpeg-android/lib/pkgconfig
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK at $NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=ON \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_LTO=OFF \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_SYSTEM_ZLIB=OFF \
            -DUSE_SYSTEM_OPENAL=OFF \
            -DUSE_SYSTEM_FFMPEG=ON \
            -DCMAKE_PREFIX_PATH="$FFMPEG_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH

      - name: Build
        run: cmake --build build --target rpcs3_libretro

      - name: Collect
        run: |
          mkdir -p artifacts
          find build -name 'rpcs3_libretro.so' -exec cp {} artifacts/rpcs3_libretro_android_${{ matrix.name }}.so \;
          ls -la artifacts
          # A gigabyte of it is debug information. The NDK toolchain file puts
          # -g in the flags for every build type and nothing takes it back out,
          # so the first Android core to link came out at 1027 MB next to 54 MB
          # for the same thing on Linux aarch64 - which is not a file anyone is
          # going to put on a phone. Strip it, and print both sizes so a core
          # that starts arriving unstripped again says so in the log.
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ ! -x "$STRIP" ]; then STRIP="$(command -v llvm-strip || command -v strip)"; fi
          echo "before: $(stat -c %s artifacts/rpcs3_libretro_android_${{ matrix.name }}.so) bytes"
          "$STRIP" --strip-unneeded artifacts/rpcs3_libretro_android_${{ matrix.name }}.so
          echo "after:  $(stat -c %s artifacts/rpcs3_libretro_android_${{ matrix.name }}.so) bytes"
          ls -la artifacts

      - name: Add the core info file
        run: cp rpcs3/libretro/rpcs3_libretro.info artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpcs3_libretro-android-${{ matrix.name }}
          path: |
            artifacts/*.so
            artifacts/*.info
          compression-level: 0

